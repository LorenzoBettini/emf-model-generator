version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "org.eclipse.emf:org.eclipse.emf.ecore.xmi"
        versions: [">=2.41.0"] # To stay compliant with Eclipse 2026-06
    groups:
      # update official Maven plugins in a single pull request
      maven-plugin-updates:
        patterns:
         - "org.apache.maven.plugins:*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
