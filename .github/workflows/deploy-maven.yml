# Publish Maven artifacts to the Central Portal.

name: Deploy Maven

on:
  workflow_dispatch:
    inputs:
      publish-type:
        description: Publish a snapshot or a release
        type: choice
        options:
          - snapshot
          - release
        default: snapshot
        required: true

jobs:
   build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: temurin
        cache: maven
        server-id: central # Value of the Maven central repository
        server-username-env-var: MAVEN_USERNAME # env variable for username in deploy
        server-password-env-var: MAVEN_CENTRAL_TOKEN # env variable for token in deploy
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }} # Value of the GPG private key to import
        gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE # env variable for GPG private key passphrase
    - name: Remove SNAPSHOT
      if: inputs.publish-type == 'release'
      run: >
        ./mvnw
        versions:set
        -DgenerateBackupPoms=false -DremoveSnapshot=true
    - name: Publish to Central Portal
      run: >
        ./mvnw
        -Psonatype-oss-release
        deploy
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
