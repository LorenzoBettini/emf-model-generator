name: PR Build (macOS and Windows)

on:
  push:
    branches: [ 'master' ]
    paths-ignore:
      - '**.md'
      - '**.tex'
  pull_request:
    branches: [ '**' ]
    paths-ignore:
      - '**.md'
      - '**.tex'

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: ./mvnw package
    
    - name: Archive Test Results
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}
        path: target/surefire-reports/
      if: always()