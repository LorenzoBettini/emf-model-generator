name: Publish Test Reports

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Generate JaCoCo report
        run: ./mvnw -P jacoco verify

      - name: Generate PIT report
        run: >
          ./mvnw
          org.pitest:pitest-maven:mutationCoverage
          -Dpit-timeout-const=1000

      - name: Checkout site repository
        uses: actions/checkout@v7
        with:
          repository: LorenzoBettini/emf-model-generator-site
          ref: master
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      - name: Copy reports
        run: |
          rm -rf site/jacoco site/pit

          mkdir -p site/jacoco site/pit

          cp -a target/site/jacoco/. site/jacoco/
          cp -a target/pit-reports/. site/pit/

          touch site/.nojekyll

      - name: Create site index
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>EMF Model Generator Reports</title>

            <style>
              :root {
                color-scheme: light dark;
                font-family:
                  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
                  Arial, sans-serif;
              }

              body {
                margin: 0;
                background: #f6f8fa;
                color: #1f2328;
              }

              main {
                max-width: 760px;
                margin: 80px auto;
                padding: 0 24px;
              }

              h1 {
                margin-bottom: 8px;
                font-size: 2.2rem;
              }

              .subtitle {
                margin-top: 0;
                margin-bottom: 32px;
                color: #656d76;
                font-size: 1.1rem;
              }

              .reports {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                gap: 20px;
              }

              .report {
                display: block;
                padding: 24px;
                border: 1px solid #d0d7de;
                border-radius: 12px;
                background: #ffffff;
                color: inherit;
                text-decoration: none;
                box-shadow: 0 1px 2px rgba(31, 35, 40, 0.04);
                transition:
                  transform 0.15s ease,
                  box-shadow 0.15s ease,
                  border-color 0.15s ease;
              }

              .report:hover {
                transform: translateY(-2px);
                border-color: #0969da;
                box-shadow: 0 6px 18px rgba(31, 35, 40, 0.10);
              }

              .report h2 {
                margin: 0 0 8px;
                color: #0969da;
                font-size: 1.35rem;
              }

              .report p {
                margin: 0;
                color: #656d76;
                line-height: 1.5;
              }

              footer {
                margin-top: 36px;
                padding-top: 20px;
                border-top: 1px solid #d8dee4;
                color: #656d76;
                font-size: 0.9rem;
              }

              footer a {
                color: #0969da;
                text-decoration: none;
              }

              footer a:hover {
                text-decoration: underline;
              }

              code {
                font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
                font-size: 0.9em;
              }

              @media (prefers-color-scheme: dark) {
                body {
                  background: #0d1117;
                  color: #e6edf3;
                }

                .subtitle,
                .report p,
                footer {
                  color: #8b949e;
                }

                .report {
                  background: #161b22;
                  border-color: #30363d;
                }

                .report:hover {
                  border-color: #2f81f7;
                  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
                }

                .report h2,
                footer a {
                  color: #58a6ff;
                }

                footer {
                  border-color: #30363d;
                }
              }
            </style>
          </head>

          <body>
            <main>
              <h1>EMF Model Generator</h1>
              <p class="subtitle">Quality and testing reports</p>

              <div class="reports">
                <a class="report" href="jacoco/">
                  <h2>JaCoCo</h2>
                  <p>Code coverage report</p>
                </a>

                <a class="report" href="pit/">
                  <h2>PIT</h2>
                  <p>Mutation testing report</p>
                </a>
              </div>

              <footer>
                Generated from
                <a href="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}">
                  <code>${SHORT_SHA}</code>
                </a>
              </footer>
            </main>
          </body>
          </html>
          EOF

      - name: Publish reports
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Reports have not changed."
          else
            git commit -m "Update reports from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            git push origin master
          fi
