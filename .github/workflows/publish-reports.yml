name: Publish Reports

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-reports
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Record source commit
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Generate JaCoCo report
        run: ./mvnw -P jacoco clean verify

      - name: Generate test and Javadoc reports
        run: >
          ./mvnw
          -P reports
          surefire-report:report-only
          javadoc:javadoc

      - name: Generate PIT report
        run: >
          ./mvnw
          org.pitest:pitest-maven:mutationCoverage
          -Dpit-timeout-const=1000

      - name: Generate dependency information
        run: |
          mkdir -p target/dependency-report

          ./mvnw dependency:list \
            -DincludeScope=runtime \
            -DoutputFile=target/dependency-report/dependency-list.txt

          ./mvnw dependency:tree \
            -Dscope=runtime \
            -DoutputFile=target/dependency-report/dependency-tree.txt

      - name: Checkout site repository
        uses: actions/checkout@v7
        with:
          repository: LorenzoBettini/emf-model-generator-site
          ref: master
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      - name: Copy reports
        run: |
          rm -rf \
            site/tests \
            site/jacoco \
            site/pit \
            site/javadoc \
            site/dependencies

          mkdir -p \
            site/tests \
            site/jacoco \
            site/pit \
            site/javadoc \
            site/dependencies

          cp -a target/surefire-report/. site/tests/
          cp -a target/site/jacoco/. site/jacoco/
          cp -a target/pit-reports/. site/pit/
          cp -a target/javadoc-report/apidocs/. site/javadoc/

          cp target/dependency-report/dependency-list.txt \
            site/dependencies/
          cp target/dependency-report/dependency-tree.txt \
            site/dependencies/

          touch site/.nojekyll

      - name: Create dependency page
        run: |
          DEPENDENCY_LIST="$(
            sed \
              -e 's/&/\&amp;/g' \
              -e 's/</\&lt;/g' \
              -e 's/>/\&gt;/g' \
              target/dependency-report/dependency-list.txt
          )"

          DEPENDENCY_TREE="$(
            sed \
              -e 's/&/\&amp;/g' \
              -e 's/</\&lt;/g' \
              -e 's/>/\&gt;/g' \
              target/dependency-report/dependency-tree.txt
          )"

          cat > site/dependencies/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>EMF Model Generator Dependencies</title>

            <style>
              :root {
                color-scheme: light dark;
                font-family:
                  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                  Helvetica, Arial, sans-serif;
              }

              body {
                margin: 0;
                background: #f6f8fa;
                color: #1f2328;
              }

              main {
                max-width: 1000px;
                margin: 60px auto;
                padding: 0 24px 60px;
              }

              h1 {
                margin-bottom: 8px;
              }

              h2 {
                margin-top: 40px;
                padding-bottom: 8px;
                border-bottom: 1px solid #d8dee4;
              }

              .subtitle {
                margin-top: 0;
                color: #656d76;
                font-size: 1.1rem;
              }

              .note {
                margin: 24px 0;
                padding: 16px 20px;
                border-left: 4px solid #0969da;
                background: #ddf4ff;
                line-height: 1.5;
              }

              pre {
                padding: 16px;
                overflow: auto;
                border: 1px solid #d0d7de;
                border-radius: 8px;
                background: #ffffff;
                line-height: 1.45;
              }

              code {
                font-family:
                  ui-monospace, SFMono-Regular, Consolas, monospace;
              }

              a {
                color: #0969da;
                text-decoration: none;
              }

              a:hover {
                text-decoration: underline;
              }

              .downloads {
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
              }

              footer {
                margin-top: 40px;
                padding-top: 20px;
                border-top: 1px solid #d8dee4;
                color: #656d76;
                font-size: 0.9rem;
              }

              @media (prefers-color-scheme: dark) {
                body {
                  background: #0d1117;
                  color: #e6edf3;
                }

                .subtitle,
                footer {
                  color: #8b949e;
                }

                h2,
                footer {
                  border-color: #30363d;
                }

                pre {
                  background: #161b22;
                  border-color: #30363d;
                }

                .note {
                  background: #12243a;
                  border-color: #58a6ff;
                }

                a {
                  color: #58a6ff;
                }
              }
            </style>
          </head>

          <body>
            <main>
              <p><a href="../">&larr; EMF Model Generator reports</a></p>

              <h1>Dependencies and Runtime Requirements</h1>

              <p class="subtitle">
                Runtime dependencies and OSGi requirements for EMF Model Generator.
              </p>

              <p class="note">
                EMF Model Generator introduces no runtime library dependency
                beyond EMF itself. The resolved Maven runtime dependency set
                below is generated from the exact project revision shown at
                the bottom of this page.
              </p>

              <h2>OSGi Requirements</h2>

              <p>
                The EMF Model Generator bundle imports only the following
                EMF packages:
              </p>

              <pre><code>org.eclipse.emf.common.util
          org.eclipse.emf.ecore
          org.eclipse.emf.ecore.resource
          org.eclipse.emf.ecore.resource.impl
          org.eclipse.emf.ecore.util
          org.eclipse.emf.ecore.xmi.impl</code></pre>

              <p>
                Required execution environment:
                <code>JavaSE-21</code>.
              </p>

              <p>
                No additional non-EMF packages are imported by the
                EMF Model Generator bundle.
              </p>

              <h2>Resolved Runtime Dependencies</h2>

              <p>
                This is the exact Maven runtime dependency set resolved for
                this build. The version of the EMF dependency declared by
                the project, together with all of its transitive
                dependencies, is therefore recorded here.
              </p>

              <pre><code>${DEPENDENCY_LIST}</code></pre>

              <h2>Runtime Dependency Tree</h2>

              <p>
                The same dependency set shown with its transitive
                relationships:
              </p>

              <pre><code>${DEPENDENCY_TREE}</code></pre>

              <h2>Raw Data</h2>

              <p class="downloads">
                <a href="dependency-list.txt">
                  Runtime dependency list
                </a>

                <a href="dependency-tree.txt">
                  Runtime dependency tree
                </a>

                <a href="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${SOURCE_SHA}/pom.xml">
                  POM for this revision
                </a>
              </p>

              <footer>
                Generated from
                <a href="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}">
                  <code>${SOURCE_SHORT_SHA}</code>
                </a>
              </footer>
            </main>
          </body>
          </html>
          EOF

      - name: Create site index
        run: |
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>EMF Model Generator Reports</title>

            <style>
              :root {
                color-scheme: light dark;
                font-family:
                  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                  Helvetica, Arial, sans-serif;
              }

              body {
                margin: 0;
                background: #f6f8fa;
                color: #1f2328;
              }

              main {
                max-width: 760px;
                margin: 80px auto;
                padding: 0 24px;
              }

              h1 {
                margin-bottom: 8px;
                font-size: 2.2rem;
              }

              .subtitle {
                margin-top: 0;
                margin-bottom: 32px;
                color: #656d76;
                font-size: 1.1rem;
              }

              .reports {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                gap: 20px;
              }

              .report {
                display: block;
                padding: 24px;
                border: 1px solid #d0d7de;
                border-radius: 12px;
                background: #ffffff;
                color: inherit;
                text-decoration: none;
                box-shadow: 0 1px 2px rgba(31, 35, 40, 0.04);
                transition:
                  transform 0.15s ease,
                  box-shadow 0.15s ease,
                  border-color 0.15s ease;
              }

              .report:hover {
                transform: translateY(-2px);
                border-color: #0969da;
                box-shadow: 0 6px 18px rgba(31, 35, 40, 0.10);
              }

              .report h2 {
                margin: 0 0 8px;
                color: #0969da;
                font-size: 1.35rem;
              }

              .report p {
                margin: 0;
                color: #656d76;
                line-height: 1.5;
              }

              footer {
                margin-top: 36px;
                padding-top: 20px;
                border-top: 1px solid #d8dee4;
                color: #656d76;
                font-size: 0.9rem;
              }

              footer a {
                color: #0969da;
                text-decoration: none;
              }

              footer a:hover {
                text-decoration: underline;
              }

              code {
                font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
                font-size: 0.9em;
              }

              @media (prefers-color-scheme: dark) {
                body {
                  background: #0d1117;
                  color: #e6edf3;
                }

                .subtitle,
                .report p,
                footer {
                  color: #8b949e;
                }

                .report {
                  background: #161b22;
                  border-color: #30363d;
                }

                .report:hover {
                  border-color: #2f81f7;
                  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
                }

                .report h2,
                footer a {
                  color: #58a6ff;
                }

                footer {
                  border-color: #30363d;
                }
              }
            </style>
          </head>

          <body>
            <main>
              <h1>EMF Model Generator</h1>
              <p class="subtitle">Documentation and quality reports</p>

              <div class="reports">
                <a class="report" href="tests/">
                  <h2>Tests</h2>
                  <p>JUnit test results</p>
                </a>

                <a class="report" href="jacoco/">
                  <h2>JaCoCo</h2>
                  <p>Code coverage report</p>
                </a>

                <a class="report" href="pit/">
                  <h2>PIT</h2>
                  <p>Mutation testing report</p>
                </a>

                <a class="report" href="javadoc/">
                  <h2>Javadoc</h2>
                  <p>API documentation</p>
                </a>

                <a class="report" href="dependencies/">
                  <h2>Dependencies</h2>
                  <p>Runtime dependencies and OSGi requirements</p>
                </a>
              </div>

              <footer>
                Generated from
                <a href="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}">
                  <code>${SOURCE_SHORT_SHA}</code>
                </a>
              </footer>
            </main>
          </body>
          </html>
          EOF

      - name: Publish reports
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Reports have not changed."
          else
            git commit -m "Update reports from ${GITHUB_REPOSITORY}@${SOURCE_SHORT_SHA}"
            git push origin master
          fi