name: Publish Test Reports

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Generate JaCoCo report
        run: ./mvnw -P jacoco verify

      - name: Generate PIT report
        run: >
          ./mvnw
          org.pitest:pitest-maven:mutationCoverage
          -Dpit-timeout-const=1000

      - name: Checkout site repository
        uses: actions/checkout@v7
        with:
          repository: LorenzoBettini/emf-model-generator-site
          ref: master
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      - name: Copy reports
        run: |
          rm -rf site/jacoco site/pit

          mkdir -p site/jacoco site/pit

          cp -a target/site/jacoco/. site/jacoco/
          cp -a target/pit-reports/. site/pit/

          touch site/.nojekyll

      - name: Create site index
        run: |
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>EMF Model Generator Reports</title>
          </head>
          <body>
            <h1>EMF Model Generator Reports</h1>

            <ul>
              <li><a href="jacoco/">JaCoCo Code Coverage Report</a></li>
              <li><a href="pit/">PIT Mutation Testing Report</a></li>
            </ul>

            <p>
              Generated from
              <a href="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}">
                ${GITHUB_SHA}
              </a>
            </p>
          </body>
          </html>
          EOF

      - name: Publish reports
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Reports have not changed."
          else
            git commit -m "Update reports from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            git push origin master
          fi
