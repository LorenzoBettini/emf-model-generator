name: Reproduce Performance Smoke Runs

on:
  workflow_dispatch:
    inputs:
      preset:
        description: 'Smoke or bounded pilot on hosted OS runners'
        type: choice
        options:
          - smoke
          - pilot
        default: smoke

jobs:
  benchmark:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run forked benchmark series and validate CSV/console output
        shell: bash
        run: python scripts/performance_evaluation.py run --preset '${{ inputs.preset }}'
      - name: Upload raw rows, summaries, diagnostics, logs, metadata and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ inputs.preset }}-${{ matrix.os }}
          path: target/benchmark/
          if-no-files-found: warn
